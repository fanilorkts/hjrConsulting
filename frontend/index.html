<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HJRConsulting</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header class="p-3">
        <nav class="d-flex align-items-center container">
            <div class="navbar-left">
                <img src="" alt="HJRConsulting Logo">
            </div>
            <div class="navbar-right ms-auto d-none d-lg-flex">
                <ul class="link list-unstyled d-flex align-items-center gap-2 mb-0">
                </ul>
            </div>
            <div class="burger-menu d-lg-none ms-auto">
                <input type="checkbox" id="burger-toggle" class="burger-checkbox">
                <label for="burger-toggle" class="burger-icon">
                    <i class="bi bi-list"></i>
                </label>
                <div class="burger-dropdown">
                    <label for="burger-toggle" class="burger-close">
                        <i class="bi bi-x"></i>
                    </label>
                    <ul class="list-unstyled text-center">
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="sections-container">
    </main>

    <footer class="row row-cols-1 row-cols-sm-2 row-cols-md-5 py-5">
        <div class="col m-5">
            <a href="/" class="d-flex align-items-center mb-3 link-body-emphasis text-decoration-none">
                <img src="" alt="HJRConsulting Logo">
            </a>
            <p class="text-body-secondary"></p>
        </div>
        <div class="col mb-3"></div>
        <div class="col mb-3">
            <h5>Navigation</h5>
            <ul class="nav flex-column">
            </ul>
        </div>
        <div class="col mb-3">
            <h5>Services</h5>
            <ul class="nav flex-column">
            </ul>
        </div>
    </footer>

    <script src="js/bootstrap.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
